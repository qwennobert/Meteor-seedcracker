[versions]
mod-version = "0.1.0"

# Java: SeedMapper for 1.21.11 is compiled for Java 23 and uses the Foreign Function & Memory API
jdk = "23"

# Fabric (https://fabricmc.net/develop)
minecraft = "1.21.11"
yarn-mappings = "1.21.11+build.3"
fabric-loader = "0.18.2"
fabric-api = "0.141.6+1.21.11"

# Loom (https://github.com/FabricMC/fabric-loom)
loom = "1.14-SNAPSHOT"

# Meteor (https://github.com/MeteorDevelopment/meteor-client/)
meteor = "1.21.11-SNAPSHOT"

# Mods
# Baritone, Meteor fork (https://github.com/MeteorDevelopment/baritone)
baritone = "1.21.11-SNAPSHOT"
# SeedMapper (https://github.com/xpple/SeedMapper), last release for 1.21.11
seedmapper = "2.21.2"

[libraries]
# Fabric base
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
yarn = { module = "net.fabricmc:yarn", version.ref = "yarn-mappings" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }

# Meteor client
meteor-client = { module = "meteordevelopment:meteor-client", version.ref = "meteor" }

# Mods
baritone = { module = "meteordevelopment:baritone", version.ref = "baritone" }
seedmapper = { module = "maven.modrinth:seedmapper", version.ref = "seedmapper" }

[plugins]
fabric-loom = { id = "fabric-loom", version.ref = "loom" }
