name: Publish Development Build
on: push

permissions:
  # Needed to create a release for every build
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 23

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seed-miner
          path: build/libs/

      - name: Read Version
        id: version
        run: echo "version=$(grep '^mod-version' gradle/libs.versions.toml | cut -d'"' -f2)+build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Seed Miner ${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            ./build/libs/*.jar
