name: Publish Development Build
on: push

permissions:
  # Needed to create a release for every build
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Whole history and tags, for the commits since the previous build in the release notes
          fetch-depth: 0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 23

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seed-miner
          path: build/libs/

      - name: Read Version
        id: version
        run: echo "version=$(grep '^mod-version' gradle/libs.versions.toml | cut -d'"' -f2)+build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Release Notes
        run: |
          version="${{ steps.version.outputs.version }}"
          {
            # The section of this build from CHANGELOG.md, if there is one
            awk -v v="$version" '/^## / { if (p) exit; if ($2 == v) p = 1; next } p' CHANGELOG.md
            echo
            echo "### Commits"
            echo
            prev=$(git tag -l 'build-*' --sort=-v:refname | grep -vx "build-${{ github.run_number }}" | head -1)
            git log --reverse --format='#### %s%n%n%b' ${prev:+$prev..}HEAD | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:'
            echo
            echo "Full changelog: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/CHANGELOG.md)"
          } > release-notes.md
          cat release-notes.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Seed Miner ${{ steps.version.outputs.version }}
          make_latest: true
          body_path: release-notes.md
          files: |
            ./build/libs/*.jar
